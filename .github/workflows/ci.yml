name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked environment
        run: |
          python -m pip install "uv==0.10.4"
          uv sync --locked --python "${{ matrix.python-version }}" --extra test --extra dev

      - name: Check lock file
        run: uv lock --check

      - name: Lint
        run: uv run --frozen --no-sync ruff check src/ tests/ scripts/

      - name: Type check
        run: uv run --frozen --no-sync mypy src/cellpose_mcp --ignore-missing-imports

      - name: Test
        run: uv run --frozen --no-sync pytest -m "not slow"
