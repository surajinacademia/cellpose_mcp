# Publish source + wheel to PyPI when a release tag is pushed (e.g. v0.1.5).
#
# Setup (one-time on https://pypi.org ):
#   1. Project → Settings → Publishing → "Add a new pending publisher"
#   2. Provider: GitHub
#   3. Repository owner + name: must match this repo (e.g. surajinacademia/cellpose_mcp)
#   4. Workflow name: publish-pypi.yml  (this file)
#   5. Environment name: leave blank unless you add `environment: pypi` below and create
#      a matching GitHub Environment — then use the same name on PyPI.
#   6. Save; PyPI will allow OIDC uploads from that workflow only.
#
# After that, tagging triggers this workflow; no long-lived API token in GitHub secrets.

name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and release tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]" build twine

      - name: Verify tag and project version
        run: |
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$PROJECT_VERSION"
          python -c "import cellpose_mcp; assert cellpose_mcp.__version__ == '$PROJECT_VERSION'"

      - name: Lint and test
        run: |
          ruff check --no-fix src/ tests/
          pytest -m "not slow" --tb=short

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Test the built wheel in a clean environment
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/python -c 'from importlib.metadata import requires; assert "cellpose==3.1.1.2" in requires("cellpose-mcp")'
          .release-venv/bin/python -c 'from importlib.metadata import version; import cellpose_mcp; assert version("cellpose") == "3.1.1.2"; assert cellpose_mcp.__version__ == version("cellpose-mcp")'

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
