[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellpose-mcp"
version = "0.1.4"
description = "MCP server for AI-powered Cellpose cell segmentation via Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Suraj Sahu", email = "surajinacademia@users.noreply.github.com"}
]
maintainers = [
    {name = "Suraj Sahu", email = "surajinacademia@users.noreply.github.com"}
]
keywords = ["cellpose", "mcp", "segmentation", "microscopy", "ai", "image-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=2.10.3,<3",
    "cellpose>=3.0.0",
    "numpy>=1.26.0",
    "imageio>=2.34.0",
    "tifffile>=2021.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/surajinacademia/cellpose_mcp"
Repository = "https://github.com/surajinacademia/cellpose_mcp"
Documentation = "https://github.com/surajinacademia/cellpose_mcp"
"Bug Tracker" = "https://github.com/surajinacademia/cellpose_mcp/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock>=3.12.0",
    "build>=1.2,<2",
    "setuptools>=64",
    "setuptools_scm>=8.0",
    "wheel",
]
dev = [
    "ruff>=0.12.10",
    "mypy>=1.17.0",
    "black>=24.0.0",
    "pre-commit>=4.3.0",
    "bandit>=1.8.6",
]
all = ["cellpose-mcp[test,dev]"]

[project.scripts]
cellpose-mcp = "cellpose_mcp.__main__:main"
cellpose-mcp-install = "cellpose_mcp.cli.install:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cellpose_mcp = ["features.toml", "py.typed"]

[tool.setuptools_scm]
write_to = "src/cellpose_mcp/_version.py"
fallback_version = "0.1.0"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
tag_regex = "^(?P<prefix>v)?(?P<version>\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?)$"

[tool.pytest.ini_options]
addopts = [
    "-q",
    "--strict-markers",
    "--tb=short",
    "--cov-config=.coveragerc",
]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "smoke: marks smoke tests for quick validation",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "venv",
    "*vendored*",
    "*_vendor*",
    "*_version.py",
]
fix = false

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "Q",   # flake8-quotes
    "S",   # bandit
    "D",   # pydocstyle
    "BLE", # flake8-blind-exception
    "A",   # flake8-builtins
    "ISC", # flake8-implicit-str-concat
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
]
ignore = [
    "E501",   # line too long - let black handle this
    "BLE001", # blind except - needed for robust error handling
    "S101",   # assert detected - allow in tests
    "S110",   # try-except-pass - acceptable for best-effort operations
    "SIM105", # contextlib.suppress - prefer explicit try/except
    "TC003",  # typing-only imports - not critical
    "D401",   # imperative mood - not critical
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"src/cellpose_mcp/cli/install.py" = [
    "S603",
    "S607",
] # CLI intentionally spawns conda / user-selected Python interpreters
"tests/**" = [
    "S101",
    "S106",
    "S311",
    "D",
] # Allow asserts, hardcoded passwords, random, and skip docstrings in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
