[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellpose-mcp"
version = "0.1.0"
description = "MCP server for AI-powered Cellpose cell segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Cellpose MCP Contributors"}
]
keywords = ["cellpose", "mcp", "segmentation", "microscopy", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "fastmcp>=0.9.0",
    "cellpose>=3.0.0",
    "numpy>=1.21.0",
    "imageio>=2.9.0",
    "tifffile>=2021.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
cellpose-mcp = "cellpose_mcp.__main__:main"
cellpose-mcp-install = "cellpose_mcp.cli.install:main"

[project.urls]
Homepage = "https://github.com/yourusername/cellpose-mcp"
Documentation = "https://github.com/yourusername/cellpose-mcp"
Repository = "https://github.com/yourusername/cellpose-mcp"
Issues = "https://github.com/yourusername/cellpose-mcp/issues"

[tool.hatchling.build.targets.wheel]
packages = ["src/cellpose_mcp"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
